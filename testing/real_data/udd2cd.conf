#@description SuperNEMO demonstrator official reconstruction pipeline (version1.1.0)  
#@key_label  "name"                                                             
#@meta_label "type"

[name="flreconstruct" type="flreconstruct::section"]
numberOfEvents : integer = 100000
moduloEvents : integer = 1000

[name="pipeline" type="dpp::chain_module"]
modules : string[2] = "udd2pcd" \
                        "pcd2cd"

##############################################################

[name="udd2pcd" type="snemo::processing::udd2pcd_module"]

# Logging priority levels
logging.priority : string = "warning"

# Input UDD label
UDD_label : string = "UDD"

# Output pCD label
pCD_label : string = "pCD"
CpCD_label : string = "CpCD"

# Calo precalibration method and configuration
calo_method : string = "fwmeas"
calo_adc2volt : real = 0.00061035156 # V/ADC
calo_sampling_frequency_ghz : real = 2.56
calo_postrigger_ns : real = 250
calo_baseline_nsamples : integer = 16
calo_charge_integration_nsamples : integer = 992
calo_charge_integration_nsamples_before_peak : integer = 64
calo_time_cfd_ratio : real = 0.25 # (4/16)
calo_discard_empty_waveform : boolean = true
calo_discard_waveforms : boolean = true

# Tracker precalibration method and configuration
tracker_method : string = "basic_cluster"
tracker_method.cluster_radius_threshold_cell : real =   3.0  # in cell size unit
tracker_method.cluster_deltat_threshold_us   : real =  10.0  # in us
tracker_method.cluster_deltat_calo_min_us    : real =  -0.22 # in us
tracker_method.cluster_deltat_calo_max_us    : real =   5.0  # in us

##############################################################

[name="pcd2cd" type="snemo::processing::pcd2cd_module"]

# Logging priority levels
# "notice"  = initialization information
# "debug"   = event-wise information
# "trace"   = hit-wise information
logging.priority : string = "notice"

# Input pCD label
pCD_label : string = "pCD"
CpCD_label : string = "CpCD"

# Output CD label
CD_label : string = "CD"

# Output TCD label
TCD_label : string = "TCD"

# Output CCD label
# CCD_label : string = "CCD"

# clusterize tracker hit with invalid Z
# (at least one cathode time missing)
clusterize_invalid_z : boolean = true

# Calorimeter energy calibration method and configuration
# calo_energy_method = "200mV/MeV", "pol0_table", "pol1_table" 
# calo_energy_method : string = "200mV/MeV"
calo_energy_method : string = "pol0_table"
calo_energy_method.database : string = "calo-energy-calibration.txt"

# Calorimeter energy threshold
# calo_energy_threshold.database : string = "@THRESHOLD_CALIBRATION@"
calo_energy_threshold.default : real = 0.350 # MeV

# Calorimeter time calibration method and configuration
calo_time_method : string = "t0_table"
calo_time_method.database : string = "calo-time-calibration.txt"

# Tracker time calibration method
# tracker_time_method : string = "t0_table"
# tracker_time_method.anode.database : string = ""
# tracker_time_method.bottom_cathode.database : string = ""
# tracker_time_method.top_cathode.database : string = ""

# Tracker radius calibration method and configuration
# tracker_radius_method : string = "r=1cm"
tracker_radius_method : string = "manu"

# Tracker ehight calibration method and configuration
tracker_height_method : string = "linear_r5r6"
# tracker_height_effective : real as length = 1.42 m
# tracker_height_offset : real as length = 0 cm
# tracker_height_error : real as length = 1.0 cm

